name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WPILib 2027 uses Java 25 (matches sourceCompatibility in build.gradle)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # Caches Gradle, GradleRIO and vendordep downloads between runs
      - uses: gradle/actions/setup-gradle@v4

      - name: Build robot code
        run: chmod +x gradlew && ./gradlew assemble

      # Unit tests in src/test/java (JUnit 5)
      - name: Run unit tests
        run: ./gradlew test

      # Browsable test report; download it from the run's Summary page
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
